<style>
:root{
  color-scheme:light;
  --bg:#F0F4F1; --surface:#FFFFFF; --ink:#12201C; --muted:#53635C; --line:#D2DBD6;
  --board:#123C2D; --board-ink:#F3F7F4; --chalk:#E3A82B; --chalk-ink:#2A2000;
  --tab-line:#123C2D; --good:#176B3C; --good-bg:#DCF1E4; --bad:#A92B2B; --bad-bg:#F8E0E0; --warn-bg:#FFF0CC; --warn-ink:#5A4300;
  --font-display:'Bricolage Grotesque','Hind',system-ui,sans-serif;
  --font-body:'Hind',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1613; --surface:#15221E; --ink:#E7EFEB; --muted:#9AABA4; --line:#2A3B35;
    --board:#123C2D; --board-ink:#F3F7F4; --chalk:#EDB93F; --chalk-ink:#2A2000;
    --tab-line:#EDB93F; --good:#58CC8A; --good-bg:#17382A; --bad:#F28A8A; --bad-bg:#3E1C1C; --warn-bg:#3B3010; --warn-ink:#F2D98A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#0D1613; --surface:#15221E; --ink:#E7EFEB; --muted:#9AABA4; --line:#2A3B35;
    --board:#123C2D; --board-ink:#F3F7F4; --chalk:#EDB93F; --chalk-ink:#2A2000;
    --tab-line:#EDB93F; --good:#58CC8A; --good-bg:#17382A; --bad:#F28A8A; --bad-bg:#3E1C1C; --warn-bg:#3B3010; --warn-ink:#F2D98A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h2{font-family:var(--font-display);font-weight:800;font-size:1.3rem;line-height:1.2;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:1.05rem;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:.875rem}
a{color:inherit}

.top{background:var(--board);color:var(--board-ink);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.08) 31px 32px);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:20px 22px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:56px;height:56px;border-radius:12px;object-fit:cover;display:block}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,7.5vw,2.4rem);line-height:1.05;letter-spacing:-.01em}
.sub{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:600;margin-top:3px}
.hrow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.tag{font-size:.9rem;opacity:.9}
.adminbtn{background:transparent;color:var(--board-ink);border:1.5px solid var(--board-ink);border-radius:8px;min-height:38px;padding:0 14px;font:700 14px var(--font-body);cursor:pointer}
.adminbtn:hover{background:rgba(255,255,255,.12)}

.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px}
.hbtns{display:flex;flex-direction:row;gap:8px;align-items:center}
.themebtn{width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.adminbtn.fill{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.adminbtn.fill:hover{background:var(--chalk)}
.welcome{padding-block:22px 4px;display:flex;flex-direction:column;gap:14px}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.counter b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.counter span{font-size:.78rem;color:var(--muted)}
.timing{align-self:flex-start;background:var(--chalk);color:var(--chalk-ink);font-weight:700;padding:5px 12px;border-radius:6px;font-variant-numeric:tabular-nums}

.tabs{position:sticky;top:0;z-index:11;background:var(--surface);border-block:1px solid var(--line);margin-top:18px}
.tabrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;font:600 15px var(--font-body);color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tab-line)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.adminbtn:focus-visible,.phb:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}

main{display:flex;flex-direction:column;gap:28px;padding-block:20px 32px}
.block{display:flex;flex-direction:column;gap:12px}
.lead{font-size:1.05rem;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted)}
.fee,.marks{font-family:var(--font-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--board);color:var(--board-ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.photos.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.phb{padding:0;border:0;background:var(--line);cursor:zoom-in;border-radius:8px;overflow:hidden;display:block;aspect-ratio:1}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{position:relative;width:72px;height:72px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.x{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:var(--surface);font:700 16px/1 var(--font-body);cursor:pointer}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#lb button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));min-height:44px;padding:0 16px;border-radius:8px;border:0;background:#fff;color:#111;font:700 15px var(--font-body);cursor:pointer}

.board{background:var(--board);color:var(--board-ink);border-radius:10px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:4px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(255,255,255,.07) 31px 32px)}
.board .label{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:600}
.board .photos{margin-top:12px}
.bigword{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,11vw,3.2rem);line-height:1.1;color:var(--chalk);overflow-wrap:anywhere}
.meaning{font-size:1.5rem;font-weight:600}
.ex{margin-top:8px;opacity:.95}

form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;font:500 16px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
input[type=file]{padding:9px 10px;font-size:14px}
textarea{min-height:96px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:8px;border:1px solid transparent;font:700 15px var(--font-body);cursor:pointer;text-decoration:none;text-align:center}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.primary{background:var(--board);color:var(--board-ink)}
.btn.accent{background:var(--chalk);color:var(--chalk-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.on-good{background:var(--good);color:var(--surface)}
.btn.on-bad{background:var(--bad);color:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--chalk);color:var(--chalk-ink);font-size:12px;line-height:20px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:700}
.badge.pending{background:var(--warn-bg);color:var(--warn-ink)}
.badge.sahi{background:var(--good-bg);color:var(--good)}
.badge.galat{background:var(--bad-bg);color:var(--bad)}
.sentence{font-size:1.1rem;font-weight:500;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.loginbox{max-width:420px;margin:0 auto;width:100%}
.foot{background:var(--board);color:var(--board-ink);margin-top:8px;padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:4px}
.foot .eyebrow{color:var(--board-ink);opacity:.75}
.foot p{opacity:.9}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;text-align:center}
.card.hl{outline:3px solid var(--chalk);outline-offset:2px}
.board .actions{margin-top:12px}
.boot{padding:40px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.chip,.adminbtn{transition:background .15s,color .15s}}

:root{--r:16px;--shadow:0 1px 2px rgba(18,32,28,.06),0 6px 18px rgba(18,32,28,.07)}

.card.ans{flex-direction:row;align-items:flex-start;gap:12px;border-left:5px solid var(--warn-ink)}

/* ---------- photos ---------- */
const pp=new Map();
function getPhoto(id){
  if(!pp.has(id))pp.set(id,FS.getDoc(FS.doc(db,'gallery',id)).then(s=>s.exists()?(s.data().data||''):'').catch(()=>{pp.delete(id);return ''}));
  return pp.get(id);
}
async function loadImg(img){const d=await getPhoto(img.dataset.pid);if(d)img.src=d}
let io=null;
function hydrate(){
  const imgs=$$('img[data-pid]:not([src])');
  if(!('IntersectionObserver' in window)){imgs.forEach(loadImg);return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:'300px'});
  imgs.forEach(i=>io.observe(i));
}
function photos(ids,big){
  if(!ids||!ids.length)return '';
  return '<div class="photos'+(big?' big':'')+'">'+ids.map(id=>'<button type="button" class="phb" data-act="zoom" aria-label="View photo larger"><img data-pid="'+esc(id)+'" alt="Photo"></button>').join('')+'</div>';
}
const thumbs=key=>(S.pend[key]||[]).map((src,i)=>'<div class="th"><img src="'+src+'" alt="Selected photo"><button type="button" class="x" data-act="rmphoto" data-key="'+key+'" data-i="'+i+'" aria-label="Remove photo">×</button></div>').join('');
const photoField=key=>'<div class="field"><label for="p-'+key+'">Photos (add as many as you like, you can select several at once)</label><input id="p-'+key+'" type="file" accept="image/*" multiple data-photo="'+key+'"><div class="thumbs" id="th-'+key+'">'+thumbs(key)+'</div></div>';
function readImg(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{
        let max=1024,q=.72,out='';
        for(let n=0;n<4;n++){
          const k=Math.min(1,max/Math.max(im.width,im.height));
          const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          out=c.toDataURL('image/jpeg',q);
          if(out.length<700000)break;
          max=Math.round(max*.8);q=Math.max(.45,q-.1);
        }
        out.length<900000?res(out):rej(new Error('big'));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addPhotos(key,files,input){
  let bad=0;
  for(const f of Array.from(files)){
    try{const d=await readImg(f);(S.pend[key]=S.pend[key]||[]).push(d);const box=$('#th-'+key);if(box)box.innerHTML=thumbs(key)}
    catch(e){bad++}
  }
  input.value='';
  if(bad)toast(bad+' photo(s) could not be opened. Please choose another photo.');
}
async function uploadPending(key){
  const arr=S.pend[key]||[],ids=[];
  for(let i=0;i<arr.length;i++){
    toast('Uploading photo '+(i+1)+'/'+arr.length+'…');
    const r=await FS.addDoc(FS.collection(db,'gallery'),{type:'photo',data:arr[i],at:Date.now()});
    ids.push(r.id);pp.set(r.id,Promise.resolve(arr[i]));
  }
  return ids;
}

function shareText(kind,it){
  const link=kind==='site'?SHARE:SHARE+kind+(it&&it.id&&kind!=='word'?'/'+it.id:'');
  let m='';
  if(kind==='work')m='*Arora Classes: Daily Work ('+it.subject+')*\n'+it.title+'\n'+clip(it.text,400);
  else if(kind==='notices')m='*Arora Classes: Notice*\n'+clip(it.text,500);
  else if(kind==='word')m='*Arora Classes: Word of the day*\n'+it.word+' = '+it.meaning+'\nExample: '+clip(it.example,200)+'\n\nApna sentence is link par bhejo:';
  else if(kind==='gallery')m='*Arora Classes: Photo*'+(it.caption?'\n'+clip(it.caption,200):'');
  else if(kind==='batches')m='*Arora Classes: '+it.name+'*\nFees: ₹'+it.fee+' / mahina\nSeats: '+it.seats+(it.desc?'\n'+clip(it.desc,300):'')+'\nRoz shaam 4 se 5 baje';
  else if(kind==='results')m='*Arora Classes: Result*\n'+it.name+' | '+it.exam+' | '+it.marks;
  else m='*Arora Classes*\nDaily Work, notices, Daily Word, photos and results in one place. Daily 4 to 5 PM.';
  return m+'\n\n'+link;
}

function contact(){
  const ph=(S.info.phone||'').replace(/\D/g,''),map=S.info.map||MAP_DEFAULT;
  return '<div class="card"><h3>Arora Classes</h3><p>'+(S.info.phone?'Phone: <strong>'+esc(S.info.phone)+'</strong>':'<span class="muted">Phone number will be added soon.</span>')+'</p>'+(S.info.address?'<p>Address: '+esc(S.info.address)+'</p>':'')

const initial=n=>esc((n||'?').trim().charAt(0).toUpperCase());
const mySent=()=>{
  if(!S.word)return false;
  if(lsGet('arora-sent-'+S.word.id))return true;
  const nm=S.myName.trim();
  return !!nm&&S.subs.some(s=>s.id===subId(S.word.id,nm));
};
function answers(){
  const all=curSubs().slice().sort(byNew),n=st=>all.filter(s=>s.status===st).length;
  const stats='<div class="stats3"><div class="stat good"><b>'+n('sahi')+'</b><span>Correct</span></div><div class="stat bad"><b>'+n('galat')+'</b><span>Wrong</span></div><div class="stat wait"><b>'+n('pending')+'</b><span>Pending</span></div></div>';
  const list=all.length?'<ul class="list">'+all.map(s=>'<li class="card ans '+esc(s.status)+'"><div class="av" aria-hidden="true">'+initial(s.student)+'</div><div class="ansb"><div class="row"><strong>'+esc(s.student)+'</strong><span class="badge '+esc(s.status)+'">'+(STATUS[s.status]||'')+'</span></div><p class="sentence">'+esc(s.sentence)+'</p></div></li>').join('')+'</ul>':empty(S.loaded.subs?'No answers yet. Be the first to send one!':'Loading…');
  return '<section class="block"><h2>Answers for this word <span class="count2">'+all.length+'</span></h2>'+stats+list+'</section>';
}
function vWord(){
  if(!S.word)return '<section class="block"><h2>Daily Word</h2>'+empty('The word of the day has not been added yet.')+'</section>';
  const form=mySent()
    ?'<div class="done"><b>✓ Your sentence is sent.</b><span>The teacher will check it. Your answer is in the list below.</span></div>'
    :'<section class="block"><h2>Make your own sentence</h2><p class="muted">Write one sentence of your own using this word. You can send only one sentence per word, so write it carefully.</p>'
    +'<form data-form="sentence"><div class="field"><label for="f-sn">Your name</label><input id="f-sn" name="student" maxlength="40" value="'+esc(S.myName)+'" required autocomplete="off"></div>'
    +'<div class="field"><label for="f-ss">Your sentence</label><textarea id="f-ss" name="sentence" maxlength="300" placeholder="Write your sentence in English here" required></textarea></div>'
    +'<button class="btn primary" type="submit">Send sentence</button></form></section>';
  return '<section class="block"><h2>Daily Word</h2>'+wordCard(S.word)+'</section>'+form+answers();
}
function siteTab(){
  const t=S.tab;
  if(t==='work'){
    const list=S.work.filter(w=>S.fSub==='all'||w.subject===S.fSub).slice().sort((a,b)=>S.fSort==='new'?byNew(a,b):byNew(b,a));
    return '<section class="block"><h2>Latest Daily Work</h2><div class="filters"><div class="field"><label for="f-sub">Subject</label><select id="f-sub" data-change="fsub">'+subjOpts(S.fSub,true)+'</select></div>'
    +'<div class="field"><label for="f-sort">Order</label><select id="f-sort" data-change="fsort"><option value="new"'+(S.fSort==='new'?' selected':'')+'>Newest first</option><option value="old"'+(S.fSort==='old'?' selected':'')+'>Oldest first</option></select></div></div>'
    +(list.length?'<ul class="list">'+list.map(w=>'<li'+cardId(w.id)+'><div class="row"><h3>'+esc(w.title)+'</h3><span class="small muted">'+fmt(w.at)+'</span></div><div><span class="pill">'+esc(w.subject)+'</span></div><p>'+esc(w.text)+'</p>'+photos(w.photoIds)+'</li>').join('')+'</ul>':empty(S.loaded.work?'No Daily Work yet.':'Loading…'))+'</section>';
  }
  if(t==='notices')return '<section class="block"><h2>Notice Board</h2>'+(S.notices.length?'<ul class="list">'+S.notices.slice().sort(byNew).map(n=>'<li'+cardId(n.id)+'><p>'+esc(n.text)+'</p>'+photos(n.photoIds)+'<p class="small muted">'+fmt(n.at)+'</p></li>').join('')+'</ul>':empty(S.loaded.notices?'No notices yet.':'Loading…'))+'</section>';
  if(t==='word')return vWord();
  if(t==='gallery')return '<section class="block"><h2>Gallery</h2>'+(S.posts.length?'<ul class="list">'+S.posts.slice().sort(byNew).map(g=>'<li'+cardId(g.id)+'>'+(g.caption?'<h3>'+esc(g.caption)+'</h3>':'')+photos(g.photoIds,true)+'<p class="small muted">'+fmt(g.at)+'</p></li>').join('')+'</ul>':empty(S.loaded.gallery?'Photos coming soon.':'Loading…'))+'</section>';
  if(t==='contact')return '<section class="block"><h2>Contact &amp; Location</h2>'+contact()+'</section>'+waFab();
  if(t==='results')return '<section class="block"><h2>Results</h2>'+(S.results.length?'<ul class="list">'+S.results.slice().sort(byNew).map(r=>'<li'+cardId(r.id)+'><div class="row"><h3>'+esc(r.name)+'</h3><span class="marks">'+esc(r.marks)+'</span></div><p class="small muted">'+esc(r.exam)+'</p>'+photos(r.photoIds)+'</li>').join('')+'</ul>':empty(S.loaded.results?'Results coming soon.':'Loading…'))+'</section>';
  return '';
}

    +photoField('results')+'<button class="btn primary" type="submit">Add result</button></form></section>'
    +'<section class="block"><h3>Current results</h3>'+(S.results.length?'<ul class="list">'+S.results.slice().sort(byNew).map(r=>'<li class="card"><div class="row"><strong>'+esc(r.name)+'</strong>'+delBtn('results',r.id)+'</div><p class="small muted">'+esc(r.exam)+' · '+esc(r.marks)+'</p>'+photos(r.photoIds)+'</li>').join('')+'</ul>':empty('No results.'))+'</section>',
  set:()=>'<section class="block"><h3>Coaching details</h3><form data-form="saveinfo">'
    +'<div class="field"><label for="s-a">About the coaching</label><textarea id="s-a" name="about">'+esc(S.info.about||DEFAULT_ABOUT)+'</textarea></div>'
    +'<div class="field"><label for="s-p">Phone / WhatsApp number (with 91)</label><input id="s-p" name="phone" type="tel" inputmode="numeric" value="'+esc(S.info.phone)+'" autocomplete="off"></div>'
    +'<div class="field"><label for="s-d">Address</label><input id="s-d" name="address" value="'+esc(S.info.address)+'" autocomplete="off"></div>'
    +'<div class="field"><label for="s-m">Google Maps link</label><input id="s-m" name="map" type="url" value="'+esc(S.info.map||MAP_DEFAULT)+'" autocomplete="off" autocapitalize="none"></div>'
    +'<button class="btn primary" type="submit">Save</button></form></section>'
    +'<section class="block"><h3>Change password</h3><p class="muted small">A password reset link will be sent to your email.</p><div class="actions"><button type="button" class="btn ghost" data-act="forgot">Send link to email</button></div></section>'
};

/* ---------- render (keeps typed text when data refreshes) ---------- */
function snap(){
  const v={};$$('#root input[id],#root textarea[id],#root select[id]').forEach(el=>{if(el.type!=='file')v[el.id]=el.value});
  const a=document.activeElement;
  return {v,f:a&&a.id&&$('#root').contains(a)?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null};
}
function restore(st){
  for(const id in st.v){const el=document.getElementById(id);if(el&&el.value!==st.v[id])el.value=st.v[id]}
  if(st.f){const el=document.getElementById(st.f.id);if(el){el.focus();try{if(st.f.s!=null)el.setSelectionRange(st.f.s,st.f.e)}catch(e){}}}
}
function render(keep){
  const y=window.scrollY,st=keep?snap():null;
  if(S.view==='admin'&&!S.admin)S.view='login';
  $('#root').innerHTML=S.view==='login'?vLogin():S.view==='admin'?vAdmin():vSite();
  if(st)restore(st);
  window.scrollTo(0,y);hydrate();focusItem();
}
const soft=()=>render(true);
function focusItem(){
  if(S.focusDone||!S.focusId||S.view!=='site')return;
  const el=document.getElementById('it-'+S.focusId);
  if(el){S.focusDone=true;el.scrollIntoView({block:'center'});return}
  const key={work:'work',notices:'notices',results:'results',gallery:'gallery'}[S.tab];
  if(key&&S.loaded[key]){S.focusDone=true;toast('This item is no longer on the website.')}
}
function applyHash(){
  const m=/^#(work|notices|word|gallery|results|contact)(?:-([A-Za-z0-9_-]+))?$/.exec(location.hash);
  if(!m)return false;
  S.tab=m[1];S.focusId=m[2]||'';S.focusDone=!S.focusId;S.view='site';
  return true;
}

/* ---------- live data ---------- */
const err=()=>toast('Could not load data. Check your internet.');
function listen(name,key,onFirst){
  FS.onSnapshot(FS.collection(db,name),s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[name]=true;soft()},err);
}
listen('work','work');listen('notices','notices');listen('results','results');listen('subjects','subjects');
FS.onSnapshot(FS.query(FS.collection(db,'gallery'),FS.where('type','==','post')),s=>{S.posts=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.gallery=true;soft()},err);
FS.onSnapshot(FS.doc(db,'site','info'),s=>{S.info=Object.assign({about:'',phone:'',address:'',map:''},s.exists()?s.data():{});soft()},err);
let lastWord='';
FS.onSnapshot(FS.doc(db,'site','word'),s=>{
  S.word=s.exists()?s.data():null;
  const id=S.word?S.word.id:'';
  if(id!==lastWord){lastWord=id;syncSubs()}
  soft();
},err);
setTimeout(()=>{['work','notices','results','gallery','subs'].forEach(k=>S.loaded[k]=true);soft()},6000);

let unsubSubs=null,subsKey='';
function syncSubs(){
  const key=S.word?S.word.id:'';
  if(key===subsKey)return;
  subsKey=key;if(unsubSubs){unsubSubs();unsubSubs=null}
  S.subs=[];S.loaded.subs=!key;
  if(!key)return;
  unsubSubs=FS.onSnapshot(FS.query(FS.collection(db,'submissions'),FS.where('wordId','==',key)),s=>{S.subs=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.subs=true;soft()},err);
}
AU.onAuthStateChanged(auth,u=>{
  const ok=!!u&&u.uid===ADMIN_UID;
  if(u&&!ok){AU.signOut(auth);return}
  S.admin=ok;S.email=ok?(u.email||''):'';
  if(ok&&S.view==='login')S.view='admin';
  if(!ok&&S.view==='admin')S.view='site';
  syncSubs();render(true);
});

/* ---------- forms ---------- */
const authMsg=e=>{
  const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-email'))return 'Email or password is wrong.';
  if(c.includes('too-many-requests'))return 'Too many wrong attempts. Please try again later.';
  if(c.includes('network'))return 'No internet connection.';
  return 'Could not log in. Please try again.';
};
const permMsg=e=>(e&&e.code==='permission-denied')?'Only the admin can do this. Please log in again.':'Could not save. Check your internet and try again.';
const col=n=>FS.collection(db,n);
const H={
  async sentence(d){
    if(!S.word){toast('There is no word right now.');return}
    const name=d.student.trim().replace(/\s+/g,' '),sentence=d.sentence.trim();
    if(!name||!sentence)return;
    const id=subId(S.word.id,name),ref=FS.doc(db,'submissions',id);
    if(S.subs.some(x=>x.id===id)){toast('A sentence has already been sent with this name.');return}
    try{
      const ex=await FS.getDoc(ref);
      if(ex.exists()){toast('A sentence has already been sent with this name.');return}
      await FS.setDoc(ref,{wordId:S.word.id,word:S.word.word,student:name,sentence,status:'pending',at:Date.now()});
      S.myName=name;lsSet('arora-name',name);lsSet('arora-sent-'+S.word.id,name);
      toast('Sentence sent. The teacher will check it.');
    }catch(e){toast('Could not send the sentence. Check your internet and send again.');return}
    render(false);
  },
  async login(d){try{await AU.signInWithEmailAndPassword(auth,d.email.trim(),d.pw)}catch(e){toast(authMsg(e))}},
  async addwork(d){const ids=await uploadPending('work');await FS.addDoc(col('work'),{subject:d.subject,title:d.title.trim(),text:d.text.trim(),photoIds:ids,at:Date.now()});S.pend.work=[];toast('Daily Work posted.');render(false)},
  async setword(d){const ids=await uploadPending('word');const old=S.subs.slice();await FS.setDoc(FS.doc(db,'site','word'),{id:'w'+Date.now(),word:d.word.trim(),meaning:d.meaning.trim(),example:d.example.trim(),photoIds:ids,at:Date.now()});for(const o of old){try{await FS.deleteDoc(FS.doc(db,'submissions',o.id))}catch(e){}}S.pend.word=[];S.subFilter='pending';toast('New word is set. Old answers are cleared.');render(false)},
  async addnotice(d){const ids=await uploadPending('notices');await FS.addDoc(col('notices'),{text:d.text.trim(),photoIds:ids,at:Date.now()});S.pend.notices=[];toast('Notice posted.');render(false)},
  async addgallery(d){
    if(!(S.pend.gallery||[]).length){toast('Please choose a photo first.');return}
    const ids=await uploadPending('gallery');await FS.addDoc(col('gallery'),{type:'post',caption:d.caption.trim(),photoIds:ids,at:Date.now()});S.pend.gallery=[];toast('Added to Gallery.');render(false);
  },
  async addsubject(d){await FS.addDoc(col('subjects'),{name:d.name.trim(),at:Date.now()});toast('Subject added.');render(false)},
  async addresult(d){const ids=await uploadPending('results');await FS.addDoc(col('results'),{name:d.name.trim(),exam:d.exam.trim(),marks:d.marks.trim(),photoIds:ids,at:Date.now()});S.pend.results=[];toast('Result added.');render(false)},
  async saveinfo(d){await FS.setDoc(FS.doc(db,'site','info'),{about:d.about.trim(),phone:d.phone.trim(),address:d.address.trim(),map:(d.map||'').trim()});toast('Details saved.')}
};
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  const h=H[f.dataset.form];if(!h)return;
  const d={};new FormData(f).forEach((v,k)=>{if(typeof v==='string')d[k]=v});
  const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  Promise.resolve().then(()=>h(d)).catch(x=>toast(f.dataset.form==='login'?authMsg(x):permMsg(x))).finally(()=>{if(btn&&btn.isConnected)btn.disabled=false});
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.photo&&el.files&&el.files.length){addPhotos(el.dataset.photo,el.files,el);return}
  if(el.dataset.change==='fsub'){S.fSub=el.value;render(false)}
  if(el.dataset.change==='fsort'){S.fSort=el.value;render(false)}
});

/* ---------- clicks ---------- */
const COLS={work:'work',notices:'notices',results:'results',subjects:'subjects',gallery:'gallery',submissions:'submissions'};
const A={
  tab(el){S.tab=el.dataset.tab;S.confirm='';S.focusId='';S.focusDone=true;render(false)},
  speak(el){
    if(!('speechSynthesis' in window)){toast('Audio is not supported on this phone.');return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(el.dataset.say||'');u.lang='en-IN';u.rate=.85;
      speechSynthesis.speak(u);
    }catch(e){toast('Audio could not be played.')}
  },
  theme(){lsSet(THEME_KEY,isDark()?'light':'dark');applyTheme();render(true)},
  atab(el){S.atab=el.dataset.id;S.confirm='';render(false)},
  filter(el){S.subFilter=el.dataset.id;render(false)},
  async mark(el){
    const s=S.subs.find(x=>x.id===el.dataset.id);if(!s)return;
    const v=s.status===el.dataset.val?'pending':el.dataset.val;
    try{await FS.updateDoc(FS.doc(db,'submissions',s.id),{status:v})}catch(e){toast(permMsg(e))}
  },
  async del(el){
    const type=el.dataset.type,id=el.dataset.id,k=type+':'+id;
    if(S.confirm!==k){S.confirm=k;render(true);return}
    S.confirm='';
    const item=(type==='gallery'?S.posts:type==='submissions'?S.subs:S[type]).find(x=>x.id===id);
    try{
      for(const p of (item&&item.photoIds)||[]){await FS.deleteDoc(FS.doc(db,'gallery',p));pp.delete(p)}
      await FS.deleteDoc(FS.doc(db,COLS[type],id));toast('Deleted.');
    }catch(e){toast(permMsg(e))}
    render(true);
  },
  rmphoto(el){const k=el.dataset.key;(S.pend[k]||[]).splice(+el.dataset.i,1);const box=$('#th-'+k);if(box)box.innerHTML=thumbs(k)},
  zoom(el){const im=el.querySelector('img');if(!im||!im.src)return;$('#lb img').src=im.src;$('#lb').hidden=false},
  closelb(){$('#lb').hidden=true;$('#lb img').removeAttribute('src')},
  async share(el){
    const kind=el.dataset.kind,id=el.dataset.id;
    const pool={work:S.work,notices:S.notices,gallery:S.posts,batches:S.batches,results:S.results};
    const it=kind==='word'?S.word:kind==='site'?null:(pool[kind]||[]).find(x=>x.id===id);
    if(kind!=='site'&&!it){toast('Ye cheez nahi mili.');return}
    const msg=shareText(kind,it);
    if(navigator.share){
      try{await navigator.share({text:msg});return}
      catch(e){if(e&&e.name==='AbortError')return}
    }
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');
    try{await navigator.clipboard.writeText(msg);toast('Link copy ho gaya. WhatsApp khul raha hai.')}catch(e){}
  },
  adminopen(){S.view=S.admin?'admin':'login';S.confirm='';render(false);window.scrollTo(0,0)},
  site(){S.view='site';S.confirm='';render(false);window.scrollTo(0,0)},
  async logout(){try{await AU.signOut(auth)}catch(e){}S.view='site';render(false);window.scrollTo(0,0)},
  async forgot(){
    let em=S.email;
    if(!em){const i=$('#l-e');em=i?i.value.trim():''}
    if(!em){toast('Please enter your email above first.');return}
    try{await AU.sendPasswordResetEmail(auth,em);toast('Email sent. Please check your inbox.')}catch(e){toast('Could not send the email. Check the email address.')}
  }
};
document.addEventListener('click',e=>{
  if(e.target===$('#lb')){A.closelb();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=A[el.dataset.act];if(a)a(el);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#lb').hidden)A.closelb()});
window.addEventListener('hashchange',()=>{if(location.hash==='#teacher'){S.view=S.admin?'admin':'login';render(false)}else if(applyHash()){render(false)}});
if(location.hash==='#teacher')S.view='login';else applyHash();
render(false);
</script>
